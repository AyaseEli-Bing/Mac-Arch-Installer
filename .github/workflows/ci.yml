name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell 脚本静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 运行 shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -S warning
        with:
          scandir: ./arch-install

  python-syntax:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译检查（仅标准库，无需安装依赖）
        run: |
          python -m py_compile arch-install/serve.py
          python -m py_compile arch-install/proxy-forward.py
          echo "Python 脚本语法检查通过"

  markdown:
    name: Markdown 文档检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '*.md'

  bash-syntax:
    name: Bash 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: bash -n 全部脚本
        run: |
          fail=0
          for f in arch-install/*.sh; do
            if bash -n "$f"; then
              echo "[OK]   $f"
            else
              echo "[FAIL] $f"
              fail=1
            fi
          done
          exit $fail
